<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 100 432 360" role="img" aria-label="Hacker developer logo">
  <!-- Transparent background. Bold strokes and few details so it stays readable at header size. -->

  <!-- Face -->
  <polygon points="176,214 256,186 336,214 346,300 300,382 256,398 212,382 166,300"
           fill="#0B1F3A" stroke="#E2E8F0" stroke-width="22" stroke-linejoin="miter"/>

  <!-- Sharp geometric hair -->
  <polygon points="158,236 174,148 226,178 256,116 286,178 338,148 354,236 332,216 300,234 256,198 212,234 180,216"
           fill="#1E4A7A" stroke="#22D3EE" stroke-width="12" stroke-linejoin="miter"/>

  <!-- Circuit traces: one long trace per side, with a larger orange node -->
  <g fill="none" stroke="#22D3EE" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M169 268 H112 V330"/>
    <path d="M343 268 H400 V330"/>
  </g>
  <g fill="#FF8A2B">
    <circle cx="112" cy="340" r="18"/>
    <circle cx="400" cy="340" r="18"/>
  </g>

  <!-- Two turquoise hexagon lenses joined at the centre -->
  <g fill="#22D3EE" stroke="#E2E8F0" stroke-width="18" stroke-linejoin="round">
    <polygon points="204,228 238.6,248 238.6,288 204,308 169.4,288 169.4,248"/>
    <polygon points="308,228 342.6,248 342.6,288 308,308 273.4,288 273.4,248"/>
  </g>
  <path d="M238.6 268 H273.4" stroke="#E2E8F0" stroke-width="16" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M232 352 H280" stroke="#E2E8F0" stroke-width="16" stroke-linecap="round"/>
</svg>
